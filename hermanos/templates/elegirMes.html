{% extends "base.html" %}

{% block title %}Elegir Mes{% endblock %}
{% block page_title %}Generar Mensajes{% endblock %}
{% block page_subtitle %}Selecciona el mes y qué incluir en los mensajes de confirmación{% endblock %}

{% block body %}

<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="glass-card text-center">

            <div class="mb-4">
                <i class="bi bi-calendar-month" style="font-size: 3rem; color: var(--blue-accent); opacity: 0.8;"></i>
            </div>

            <form method="POST" action="mensajes">
                {% csrf_token %}

                <div class="mb-4 text-start">
                    <label class="form-label"><i class="bi bi-calendar3 me-1"></i> Mes a realizar</label>
                    <select class="form-select" name="mes" required>
                        <option value="" disabled selected>Selecciona un mes...</option>
                        <option value="Enero">Enero</option>
                        <option value="Febrero">Febrero</option>
                        <option value="Marzo">Marzo</option>
                        <option value="Abril">Abril</option>
                        <option value="Mayo">Mayo</option>
                        <option value="Junio">Junio</option>
                        <option value="Julio">Julio</option>
                        <option value="Agosto">Agosto</option>
                        <option value="Septiembre">Septiembre</option>
                        <option value="Octubre">Octubre</option>
                        <option value="Noviembre">Noviembre</option>
                        <option value="Diciembre">Diciembre</option>
                    </select>
                </div>

                <!-- Opciones de disponibilidad a incluir en el mensaje -->
                <div class="mb-4 text-start">
                    <label class="form-label"><i class="bi bi-funnel me-1"></i> Incluir en el mensaje</label>
                    <div class="d-flex flex-column gap-2">
                        <label class="d-flex align-items-center gap-2" style="cursor: pointer; padding: 0.5rem 0.75rem; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);">
                            <input type="checkbox" name="incluir_manana" value="1" checked
                                   style="width: 1.1rem; height: 1.1rem; accent-color: var(--blue-accent);">
                            <i class="bi bi-sunrise" style="color: #fbbf24;"></i>
                            <span style="font-size: 0.9rem;">Disponibilidad Mañanas</span>
                        </label>
                        <label class="d-flex align-items-center gap-2" style="cursor: pointer; padding: 0.5rem 0.75rem; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);">
                            <input type="checkbox" name="incluir_tarde" value="1" checked
                                   style="width: 1.1rem; height: 1.1rem; accent-color: var(--blue-accent);">
                            <i class="bi bi-sunset" style="color: #f97316;"></i>
                            <span style="font-size: 0.9rem;">Disponibilidad Tardes</span>
                        </label>
                    </div>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-chat-dots me-2"></i>Generar Mensajes
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}
