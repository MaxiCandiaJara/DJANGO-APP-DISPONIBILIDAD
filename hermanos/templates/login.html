<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Predicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0a1628;
            background-image:
                radial-gradient(ellipse at 50% 30%, rgba(37, 99, 235, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(96, 165, 250, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(15, 32, 53, 0.6);
            border: 1px solid rgba(96, 165, 250, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.8rem;
            color: #fff;
        }

        .login-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.5rem;
            color: #e2e8f0;
            margin-bottom: 0.3rem;
        }

        .login-subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.88rem;
            margin-bottom: 2rem;
        }

        .form-control {
            background: rgba(10, 22, 40, 0.6) !important;
            border: 1px solid rgba(37, 99, 235, 0.2) !important;
            color: #e2e8f0 !important;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
        }

        .form-control::placeholder {
            color: #64748b !important;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.82rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-text {
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border-radius: 10px 0 0 10px;
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0 !important;
        }

        .btn-login {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            width: 100%;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            color: #fff;
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="login-icon">
            <i class="bi bi-calendar-check"></i>
        </div>

        <h1 class="login-title">Iniciar Sesión</h1>
        <p class="login-subtitle">Predicación Vicuña Mackenna</p>

        {% if error %}
        <div class="error-alert">
            <i class="bi bi-exclamation-circle-fill"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login/">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Ingresa tu usuario" required
                        autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="Ingresa tu contraseña"
                        required>
                </div>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>

    </div>

</body>

</html>
