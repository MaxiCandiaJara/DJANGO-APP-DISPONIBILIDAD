services:
  - type: web
    name: disponibilidad-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn hermanos.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://disponibilidad-app.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.4"
